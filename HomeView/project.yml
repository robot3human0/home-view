# Zaxira: HomeView.xcodeproj ochilmasa, shu fayldan qayta yaratish mumkin.
#   brew install xcodegen
#   cd HomeView && xcodegen
name: HomeView
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  HomeViewProtocol:
    path: ../HomeViewProtocol
targets:
  HomeView:
    type: application
    platform: macOS
    sources:
      - path: Sources/HomeView
      - path: Art
        buildPhase: resources
      - path: AppStore/Assets.xcassets
      - path: AppStore/AppIcon.icon
    dependencies:
      - package: HomeViewProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.home-view
        PRODUCT_NAME: HomeView
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "14"
        DEVELOPMENT_TEAM: H5VVCZ32P5
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AppStore/HomeView.entitlements
        INFOPLIST_FILE: AppStore/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MACOSX_DEPLOYMENT_TARGET: "26.0"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG APPSTORE
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
