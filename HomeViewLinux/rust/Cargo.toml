[package]
name = "homeview"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "homeview"
path = "src/lib.rs"

[[bin]]
name = "homeview"
path = "src/main.rs"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
glutin = { version = "0.32", default-features = false, features = ["glx", "x11"] }
glutin-winit = { version = "0.5", default-features = false, features = ["glx", "x11"] }
raw-window-handle = "0.6"
glow = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }
fastrand = "2"
cosmic-text = "0.12"
tiny-skia = "0.11"
x11rb = { version = "0.13", features = ["shape"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
